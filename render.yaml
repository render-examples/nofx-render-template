# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# NOFX on Render
# Repo: https://github.com/render-examples/nofx-render-template
# Upstream: https://github.com/NoFxAiOS/nofx
#
# JWT_SECRET and DATA_ENCRYPTION_KEY are auto-generated at apply time.
# RSA_PRIVATE_KEY is auto-generated on first boot by docker/render-start.sh if unset.

previews:
  generation: off

projects:
  - name: nofx-render-template
    environments:
      - name: production
        services:
          - type: web
            name: nofx
            runtime: docker
            dockerfilePath: ./Dockerfile.render
            plan: starter
            region: oregon
            healthCheckPath: /health
            disk:
              name: nofx-data
              mountPath: /app/data
              sizeGB: 5
            envVars:
              - key: DB_TYPE
                value: sqlite
              - key: DB_PATH
                value: /app/data/data.db
              - key: TZ
                value: UTC
              - key: TRANSPORT_ENCRYPTION
                value: "false"
              - key: AI_MAX_TOKENS
                value: "8000"
              - key: JWT_SECRET
                generateValue: true
              - key: DATA_ENCRYPTION_KEY
                generateValue: true
